name: cui parent pom
description: Parent pom for all CUI-OSS projects

release:
  current-version: 1.7.2
  next-version: 1.7-SNAPSHOT
  create-github-release: true

maven-build:
  java-versions: '["21"]'
  java-version: '21'
  enable-snapshot-deploy: true
  maven-profiles-release: 'release-pom'
  npm-cache: false

sonar:
  project-key: cuioss_cuioss-parent-pom
  enabled: false
  skip-on-dependabot: true

pages:
  reference: cui-parent-pom
  deploy-at-release: true

github-automation:
  auto-merge-build-versions: true
  auto-merge-build-timeout: 300

# A ":<artifactId>" suffix names the parent this consumer actually inherits, for one on a
# different parent of the same reactor. The matcher is an exact artifactId match, so without
# the suffix these three are silently skipped on every release - reported as "no changes
# needed", indistinguishable from already-current. That is how cui-reference-documentation
# ended up two releases behind.
consumers:
  - cui-core-ui-model
  - cui-http
  - cui-java-module-template
  - cui-java-tools
  - cui-jsf-components
  - cui-jsf-test-basic
  - cui-open-rewrite
  - cui-portal-core
  - cui-portal-ui
  - cui-reference-documentation:cui-quarkus-parent
  - cui-test-generator
  - cui-test-juli-logger
  - cui-test-keycloak-integration
  - cui-test-mockwebserver-junit5
  - cui-test-value-objects
  - TokenSheriff:cui-quarkus-parent
  - API-Sheriff:cui-quarkus-parent

dependency-propagation:
  group-id: de.cuioss
  artifact-id: cui-java-parent
  scope: parent
