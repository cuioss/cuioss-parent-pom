version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
    timezone: "Europe/Berlin"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
    semver-major-days: 7
    semver-minor-days: 3
    semver-patch-days: 1
  ignore:
  # smallrye-config must track the release io.quarkus:quarkus-bom is built
  # against, not the newest available. Quarkus' deployment classes are compiled
  # against a specific release, so a newer *coherent* stack still fails
  # augmentation with an IllegalAccessError on ConfigMappingLoader - and the
  # requireSameVersions guard cannot catch it, because nothing is split.
  # Bump this together with version.quarkus, never on its own.
  - dependency-name: "io.smallrye.config:*"
  # Maven 3.10.0 produces a Central bundle that the Central Portal rejects for modules
  # excluded from publishing (it failed the cui-http 3.2 release, cuioss/cui-http#270). Stay on
  # 3.9.x until https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
  # is resolved.
  - dependency-name: "org.apache.maven:apache-maven"
    versions: [">= 3.10.0"]
  # java-ee-10-bom targets Jakarta EE 10 (forward-adopting CDI 4.1 from EE 11) and
  # pairs the API with Weld 5.x, which implements CDI 4.x. CDI 5 is post-EE 11 and
  # must move together with its implementations and Quarkus, not as a lone API
  # bump (see #1481). Minor/patch updates within 4.x stay enabled.
  - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
    update-types: ["version-update:semver-major"]

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: "Europe/Berlin"
  open-pull-requests-limit: 10
  # Only `default-days`: the `semver-*-days` keys are rejected for the
  # github-actions ecosystem, and one rejected key invalidates the whole file,
  # which disables version updates for the entire repo.
  cooldown:
    default-days: 3
